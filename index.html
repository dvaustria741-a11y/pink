<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>for Celyn</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--pink:#f6c9d6;--deep:#7a2c46;--rose:#c14b70;--cream:#fdf3ec;--sage:#8fae87;--ink:#3c2b30;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;}
body{background:var(--cream);color:var(--ink);font-family:'VT323',monospace;font-size:20px;min-height:100dvh;position:relative;}
img.pixel{image-rendering:pixelated;image-rendering:crisp-edges;}
.hidden{display:none !important;}
h1,h2,.pxfont{font-family:'Press Start 2P',cursive;}
button{font-family:'VT323',monospace;cursor:pointer;}
.pxbtn{--scale:1;min-width:44px;min-height:44px;padding:10px 22px;background:var(--pink);border:3px solid var(--deep);color:var(--deep);font-size:18px;box-shadow:3px 3px 0 var(--deep);transform:scale(var(--scale));transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.pxbtn:active{transform:scale(var(--scale)) translate(2px,2px);box-shadow:1px 1px 0 var(--deep);}

/* particles */
#particles{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.petal{position:absolute;top:-6vh;width:22px;height:auto;animation:fall linear infinite;}
@keyframes fall{to{transform:translateY(112vh) rotate(180deg);}}

/* confetti (happy-birthday section only) */
#confettiLayer{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.confetti{position:absolute;top:-8vh;width:24px;height:auto;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);}100%{transform:translateY(115vh) rotate(360deg);}}

/* gatekeeper */
#gatekeeper{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;position:relative;z-index:3;}
.cake{width:120px;}
.cakeStage{position:relative;display:inline-block;cursor:pointer;}
.flame{
  position:absolute;
  left:50%; top:10%;
  width:3px;height:3px;
  background:#ff8533;
  transform:translate(-50%,-100%);
  transform-origin:50% 100%;
  box-shadow:
    0 -9px #fff4cc,
    0 -6px #ffe066,
    -3px -3px #ffcc4d,
    0 -3px #ffb84d,
    3px -3px #ffcc4d,
    -6px 0 #ff9933,
    -3px 0 #ff9933,
    3px 0 #ff9933,
    6px 0 #ff9933;
  z-index:3;
  pointer-events:none;
  animation:flameFlicker 1s ease-in-out infinite;
  transition:opacity .3s ease;
}
@keyframes flameFlicker{
  0%,100%{transform:translate(-50%,-100%) scale(1) rotate(0deg);filter:brightness(1);}
  25%{transform:translate(-53%,-102%) scale(1.05) rotate(-3deg);filter:brightness(1.15);}
  50%{transform:translate(-50%,-97%) scale(.95) rotate(2deg);filter:brightness(.95);}
  75%{transform:translate(-48%,-101%) scale(1.03) rotate(-2deg);filter:brightness(1.1);}
}
.flame.blowing{animation:flameBlowFlicker .18s ease-in-out infinite;opacity:.8;}
@keyframes flameBlowFlicker{
  0%{transform:translate(-50%,-100%) skewX(-25deg) scaleY(.7) scaleX(.85);}
  50%{transform:translate(-62%,-94%) skewX(-38deg) scaleY(.55) scaleX(.75);}
  100%{transform:translate(-50%,-100%) skewX(-25deg) scaleY(.7) scaleX(.85);}
}
.flame.out{animation:none;opacity:0;}
#smokeWrap{position:absolute;top:10%;left:50%;width:1px;height:1px;pointer-events:none;}
.smoke{position:absolute;bottom:0;left:0;width:8px;height:8px;background:rgba(140,140,140,.55);border-radius:2px;animation:smokeRise 1.4s ease-out forwards;}
@keyframes smokeRise{
  0%{opacity:.7;transform:translate(-50%,0) scale(.6);}
  40%{opacity:.55;transform:translate(-70%,-22px) scale(1);}
  100%{opacity:0;transform:translate(-30%,-52px) scale(1.6);}
}
.success-banner{text-align:center;font-size:1.1rem;color:var(--rose);margin-top:10px;opacity:0;transition:opacity .5s ease;}
.success-banner.show{opacity:1;}
.q{font-size:1.2rem;}
.btnrow{display:flex;gap:16px;}
.popup{background:#fff;border:3px solid var(--deep);box-shadow:5px 5px 0 var(--rose);padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;max-width:280px;}
.bar{width:200px;height:24px;border:3px solid var(--deep);background:#fff;}
.fill{height:100%;width:0;background:var(--rose);transition:width .4s linear;}
.tap{margin-top:8px;text-decoration:underline;}

/* dashboard */
#dashboard{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;z-index:3;}
.scenic-card{position:relative;display:grid;grid-template-areas:"stack";width:92%;max-width:400px;height:70dvh;max-height:680px;border:4px solid var(--deep);box-shadow:6px 6px 0 var(--rose);overflow:hidden;background:#eee;opacity:0;transform:translateY(-16px);animation:slideIn .6s ease forwards;}
@keyframes slideIn{to{opacity:1;transform:translateY(0);}}
.scenic-card > *{grid-area:stack;}
.scenic-card > img.banner{width:100%;height:100%;object-fit:cover;z-index:1;}
.titlestack{z-index:3;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:6% 8%;cursor:pointer;position:relative;}
.card-stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:75%;max-width:220px;}
.card-stack img{width:100%;opacity:0;transform:translateY(-30px) scale(.85);transition:opacity .5s cubic-bezier(.34,1.56,.64,1), transform .5s cubic-bezier(.34,1.56,.64,1);}
.card-stack img.show{opacity:1;transform:translateY(0) scale(1);}
.card-stack img.sparkle.show{animation:sparklePop .6s ease .5s;}
@keyframes sparklePop{0%,100%{filter:none;}40%{filter:drop-shadow(0 0 10px #f6c9d6) drop-shadow(0 0 4px #fff);}}
.titlestack.dissolve{opacity:0;transform:scale(.92);transition:opacity .5s ease, transform .5s ease;pointer-events:none;}
.tapHint{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-size:.85rem;color:var(--rose);opacity:0;animation:blink 1.4s ease infinite;background:rgba(255,255,255,.6);padding:2px 10px;}
.tapHint.show{opacity:.85;}
@keyframes blink{0%,100%{opacity:.85;}50%{opacity:.25;}}
.titlestack .cursorHint{position:absolute;right:18%;bottom:24%;top:auto;left:auto;width:11%;max-width:42px;margin:0;opacity:0;pointer-events:none;transform-origin:75% 15%;transition:none;}
.titlestack .cursorHint.show{opacity:1;animation:cursorTap 1.2s ease-in-out infinite;}
@keyframes cursorTap{0%,100%{transform:translateY(0) scale(1);}45%{transform:translateY(10px) scale(.88);}60%{transform:translateY(10px) scale(.88);}}
#balloonLayer{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.balloon{position:absolute;bottom:-90px;animation:balloonRise 3s ease-out forwards;}
.balloon svg{display:block;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.12));}
@keyframes balloonRise{
  0%{transform:translateY(0) translateX(0);}
  45%{transform:translateY(-45vh) translateX(10px);}
  70%{transform:translateY(-65vh) translateX(-8px);}
  100%{transform:translateY(-90vh) translateX(4px);opacity:0;}
}
.grid{z-index:4;width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;place-items:center;gap:6% 4%;padding:10%;pointer-events:none;}
.appicon{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;pointer-events:none;}
.appicon.crawl{animation:crawlIn .7s steps(4) forwards;pointer-events:auto;}
@keyframes crawlIn{
  0%{opacity:0;transform:scale(0) translateY(18px);}
  25%{opacity:1;transform:scale(1.3) translateY(8px);}
  55%{opacity:1;transform:scale(.8) translateY(3px);}
  80%{opacity:1;transform:scale(1.05) translateY(0);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}
.appicon img{width:15vw;max-width:56px;min-width:38px;}
.appicon .emojiIcon{font-size:clamp(30px,10vw,46px);line-height:1;}
.appicon span{font-size:.72rem;color:var(--deep);background:rgba(255,255,255,.55);padding:0 4px;}

/* modal */
#overlay{position:fixed;inset:0;background:rgba(122,44,70,.4);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;}
.modal{background:var(--cream);border:4px solid var(--deep);box-shadow:6px 6px 0 var(--rose);max-width:420px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;position:relative;transform:scale(.8);animation:modalIn .3s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes modalIn{0%{transform:scale(.8);}60%{transform:scale(1.05);}100%{transform:scale(1);}}
.closeX{position:absolute;top:8px;right:10px;background:none;border:none;font-family:'Press Start 2P';font-size:14px;color:var(--deep);}
.modal img.wide{width:100%;margin-bottom:12px;}
.modal h2{font-size:1rem;color:var(--deep);text-align:center;margin-bottom:14px;}

/* music */
.playlist-wrap{position:relative;line-height:0;}
.playlist-wrap img.wide{display:block;}
.playlist-note{line-height:1.4;text-align:center;font-size:1rem;color:var(--rose);margin-top:12px;padding:0 6px;}
.track-btn{position:absolute;left:88.8%;width:8%;height:auto;transform:translate(-50%,-50%);background:none;border:none;padding:0;line-height:0;}
.track-btn img{width:100%;height:auto;display:block;}
.track-btn.playing img{animation:pulse .8s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

/* gallery */
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px;padding:10px 8px 4px;}
.gframe{background:#fff;border:3px solid var(--deep);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--deep);overflow:hidden;box-shadow:4px 4px 0 rgba(60,43,48,.25);opacity:0;transform:scale(.6) rotate(0deg);animation:polaroidIn .55s cubic-bezier(.34,1.56,.64,1) forwards;}
.gframe:nth-child(1){--rot:-8deg;margin-top:-6px;animation-delay:.1s;}
.gframe:nth-child(2){--rot:6deg;margin-top:16px;animation-delay:.4s;}
.gframe:nth-child(3){--rot:5deg;margin-top:10px;animation-delay:.7s;}
.gframe:nth-child(4){--rot:-6deg;margin-top:-10px;animation-delay:1s;}
@keyframes polaroidIn{0%{opacity:0;transform:scale(.6) rotate(0deg);}100%{opacity:1;transform:scale(1) rotate(var(--rot));}}
/* Swap each .gframe's content with <img src="yourphoto.jpg" style="width:100%;height:100%;object-fit:cover"> */

/* letter */
.letter-bg{border-style:solid;border-width:96px 22px 128px 22px;border-image-source:url('assets/letter_card_v2.png');border-image-slice:133 30 173 30 fill;border-image-repeat:round;background:#fdf3ec;padding:6px 14px 10px;}
.letter-bg h2{margin-bottom:10px;}
.letter-bg p{white-space:pre-line;font-size:1.05rem;line-height:1.6;}
.typewriter{border-right:2px solid var(--rose);white-space:pre-wrap;overflow:hidden;}
.typewriter.done{border-right:none;}

/* traits */
.frame-photo{width:140px;display:block;margin:0 auto 16px;position:relative;z-index:2;}
.traits-scene{display:flex;align-items:flex-end;justify-content:center;gap:0;margin:0 auto 4px;}
.traits-scene .side{width:72px;position:relative;z-index:1;opacity:0;}
.traits-scene .side.left{margin-right:-22px;}
.traits-scene .side.right{margin-left:-22px;}
.traits-scene .side.left.crawl{animation:crawlInLeft .8s steps(6) forwards;}
.traits-scene .side.right.crawl{animation:crawlInRight .8s steps(6) forwards;}
@keyframes crawlInLeft{
  0%{opacity:0;transform:translate(-46px,10px) scale(.4);}
  20%{opacity:1;transform:translate(-20px,4px) scale(1.2);}
  45%{opacity:1;transform:translate(8px,-2px) scale(.85);}
  70%{opacity:1;transform:translate(-4px,1px) scale(1.05);}
  100%{opacity:1;transform:translate(0,0) scale(1);}
}
@keyframes crawlInRight{
  0%{opacity:0;transform:translate(46px,10px) scale(.4);}
  20%{opacity:1;transform:translate(20px,4px) scale(1.2);}
  45%{opacity:1;transform:translate(-8px,-2px) scale(.85);}
  70%{opacity:1;transform:translate(4px,1px) scale(1.05);}
  100%{opacity:1;transform:translate(0,0) scale(1);}
}
.badges{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;padding:6px 0;}
.badge{background:var(--pink);border:2px solid var(--deep);padding:6px 12px;font-size:.9rem;color:var(--deep);--rot:0deg;--lift:0px;opacity:0;transform:scale(.3) rotate(calc(var(--rot) * -2)) translateY(24px);}
.badge.show{animation:badgePop .6s steps(6) forwards;}
@keyframes badgePop{
  0%{opacity:0;transform:scale(.3) rotate(calc(var(--rot) * -2)) translateY(24px);}
  40%{opacity:1;transform:scale(1.2) rotate(calc(var(--rot) * -1)) translateY(-5px);}
  70%{opacity:1;transform:scale(.9) rotate(calc(var(--rot) * 1.2)) translateY(2px);}
  100%{opacity:1;transform:scale(1) rotate(var(--rot)) translateY(var(--lift));}
}

/* camera flash */
#cameraFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999;}

/* blow-candle transition */
.fadeOut{opacity:0 !important;transition:opacity .5s ease;pointer-events:none;}
#blackout{position:fixed;inset:0;background:#000;opacity:0;z-index:998;pointer-events:none;transition:opacity .4s ease;}
</style>
</head>
<body>

<div id="particles"></div>
<div id="confettiLayer"></div>
<div id="cameraFlash"></div>

<div id="gatekeeper">
  <div class="cakeStage" id="cakeStage">
    <img src="assets/cake_lit.png" class="pixel cake" id="cakeImg" alt="cake">
    <div class="flame" id="flame"></div>
    <div id="smokeWrap"></div>
  </div>
  <p class="q" id="candleQ">Make a wish &amp; blow out the candle! 🎂</p>
  <div class="btnrow" id="blowBtnRow">
    <button class="pxbtn" id="micBtn">🎤 Enable Mic to Blow</button>
    <button class="pxbtn" id="tapBtn">👆 Tap to Blow Out</button>
  </div>
  <p id="successBanner" class="success-banner hidden">May all your wishes come true, Celyn! 🎉✨</p>
</div>

<div id="overlay" class="hidden"><div class="modal" id="modalBox"></div></div>

<div id="dashboard" class="hidden">
  <div class="scenic-card">
    <img src="assets/banner_landscape.png" class="pixel banner" alt="">
    <div id="balloonLayer"></div>
    <div class="titlestack" id="titlestack">
      <div class="card-stack">
        <img src="assets/happy_card.png" class="pixel" alt="happy" id="w1">
        <img src="assets/birthday_card.png" class="pixel" alt="birthday" id="w2">
        <img src="assets/celyn_card.png" class="pixel sparkle" alt="Celyn!" id="w3">
      </div>
      <p class="tapHint hidden" id="tapHint">tap</p>
      <img src="assets/cursor_hand.png" class="pixel cursorHint" id="cursorHint" alt="">
    </div>
    <div class="grid">
      <button class="appicon" data-modal="music"><img class="pixel" src="assets/record.png" alt=""><span>Music</span></button>
      <button class="appicon" data-modal="gallery"><img class="pixel" src="assets/camera.png" alt=""><span>Gallery</span></button>
      <button class="appicon" data-modal="letter"><img class="pixel" src="assets/envelope.png" alt=""><span>Letter</span></button>
      <button class="appicon" data-modal="traits"><img class="pixel" src="assets/question_block.png" alt=""><span>Traits</span></button>
      <button class="appicon hidden" id="messageIcon" data-modal="message"><img class="pixel" src="assets/message_icon.png" alt=""><span>Message (optional)</span></button>
    </div>
  </div>
</div>

<script>
/* ---------- particles ---------- */
for(let i=0;i<16;i++){
  const p=document.createElement('img');
  p.src='assets/petal.png';
  p.className='pixel petal';
  p.alt='';
  p.style.left=Math.random()*100+'vw';
  p.style.width=(16+Math.random()*10)+'px';
  p.style.animationDuration=(6+Math.random()*6)+'s';
  p.style.animationDelay=Math.random()*6+'s';
  document.getElementById('particles').appendChild(p);
}

/* ---------- gatekeeper: blow out the candle ---------- */
let blownAlready=false;

function spawnSmoke(){
  const wrap=document.getElementById('smokeWrap');
  const count=3+Math.floor(Math.random()*3); // 3-5 particles
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const s=document.createElement('div');
      s.className='smoke';
      s.style.left=(Math.random()*10-5)+'px';
      s.style.animationDuration=(1+Math.random()*.6)+'s';
      wrap.appendChild(s);
      setTimeout(()=>s.remove(),1600);
    }, i*150);
  }
}

function burstCelebration(){
  spawnConfetti();
  setTimeout(spawnConfetti,500);
  setTimeout(spawnConfetti,1000);
  setTimeout(spawnConfetti,1500);
}

function triggerBlowOut(source){
  if(blownAlready) return;
  blownAlready=true;

  const flame=document.getElementById('flame');
  flame.classList.remove('blowing');
  flame.classList.add('out');

  document.getElementById('cakeImg').src='assets/cake_off.png';
  spawnSmoke();
  burstCelebration();
  if(source!=='mic'){
    /* the person's real blow already made the sound when caught by the mic,
       so only play the effect for the tap fallback */
    try{ new Audio('assets/audio/blow_candle.mp3').play(); }catch(e){}
  }

  const q=document.getElementById('candleQ');
  const row=document.getElementById('blowBtnRow');
  const banner=document.getElementById('successBanner');
  if(q) q.classList.add('fadeOut');
  if(row) row.classList.add('fadeOut');
  banner.classList.remove('hidden');
  requestAnimationFrame(()=>banner.classList.add('show'));

  setTimeout(()=>{
    banner.classList.add('fadeOut');
    const blackout=document.createElement('div');
    blackout.id='blackout';
    document.body.appendChild(blackout);
    requestAnimationFrame(()=>{ blackout.style.opacity='1'; });
    setTimeout(()=>{
      document.getElementById('gatekeeper').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      revealDashboard();
      blackout.style.transition='none';
      blackout.style.opacity='0';
      setTimeout(()=>blackout.remove(), 50);
    },2400);
  },2600);
}

/* mic-based blow detection via Web Audio API */
const BLOW_THRESHOLD=42; // 0-255 average frequency level; tune if too sensitive/insensitive
const WIND_THRESHOLD=18; // lower level that just makes the flame flicker in the "wind"
async function enableMicBlow(){
  const micBtn=document.getElementById('micBtn');
  const flame=document.getElementById('flame');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    const ctx=new AudioCtx();
    const source=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();
    analyser.fftSize=512;
    source.connect(analyser);
    const data=new Uint8Array(analyser.frequencyBinCount);
    micBtn.textContent='🎤 Listening… blow now!';
    micBtn.disabled=true;
    function stopMic(){
      stream.getTracks().forEach(t=>t.stop());
      ctx.close();
    }
    function checkLevel(){
      if(blownAlready){ stopMic(); return; }
      analyser.getByteFrequencyData(data);
      let sum=0;
      for(let i=0;i<data.length;i++) sum+=data[i];
      const avg=sum/data.length;
      if(avg>BLOW_THRESHOLD){
        stopMic();
        triggerBlowOut('mic');
      }else{
        flame.classList.toggle('blowing', avg>WIND_THRESHOLD);
        requestAnimationFrame(checkLevel);
      }
    }
    checkLevel();
  }catch(e){
    /* mic blocked or unsupported: fall back to tap */
    micBtn.classList.add('hidden');
  }
}
document.getElementById('micBtn').addEventListener('click',enableMicBlow);

function tapBlow(){
  if(blownAlready) return;
  const flame=document.getElementById('flame');
  flame.classList.add('blowing');
  setTimeout(()=>triggerBlowOut('tap'),450);
}
document.getElementById('tapBtn').addEventListener('click',tapBlow);
document.getElementById('cakeStage').addEventListener('click',tapBlow);

/* ---------- title drop, then tap-to-continue ---------- */
let bgMusic=null;
function pauseBg(){ if(bgMusic && !bgMusic.paused) bgMusic.pause(); }
function resumeBg(){ if(bgMusic && bgMusic.paused) bgMusic.play().catch(()=>{}); }
function revealDashboard(){
  try{ bgMusic=new Audio('assets/audio/happy_birthday.mp3'); bgMusic.loop=true; bgMusic.play(); }catch(e){}
  try{ new Audio('assets/audio/confetti_pop.mp3').play(); }catch(e){}
  try{ new Audio('assets/audio/party_horn.mp3').play(); }catch(e){}
  spawnConfetti();
  const words=[['w1',100],['w2',500],['w3',900]];
  words.forEach(([id,delay])=>{
    setTimeout(()=>document.getElementById(id).classList.add('show'), delay);
  });
  setTimeout(()=>{
    document.getElementById('tapHint').classList.add('show');
    document.getElementById('cursorHint').classList.add('show');
    document.querySelector('.titlestack').addEventListener('click', onTitleTap, {once:true});
  }, 1500);
}

const confettiColors=['gold','green','purple','pink','red'];
function spawnConfetti(){
  const layer=document.getElementById('confettiLayer');
  for(let i=0;i<26;i++){
    const c=document.createElement('img');
    c.src='assets/confetti_'+confettiColors[i%confettiColors.length]+'.png';
    c.className='pixel confetti';
    c.alt='';
    c.style.left=Math.random()*100+'vw';
    c.style.width=(14+Math.random()*12)+'px';
    c.style.animationDuration=(3+Math.random()*2.5)+'s';
    c.style.animationDelay=(Math.random()*1.5)+'s';
    layer.appendChild(c);
  }
}

function onTitleTap(){
  document.getElementById('tapHint').classList.add('hidden');
  document.getElementById('cursorHint').classList.add('hidden');
  document.getElementById('confettiLayer').innerHTML='';
  document.querySelector('.titlestack').classList.add('dissolve');
  spawnBalloons();
  setTimeout(revealIcons, 1500);
}

const balloonColors=['#f6c9d6','#c9dbb0','#cdbfe8','#faf3e0'];
function balloonSVG(color){
  return `<svg viewBox="0 0 40 70" width="${34+Math.random()*16}" xmlns="http://www.w3.org/2000/svg">
    <polyline points="20,50 17,55 23,60 17,65 20,70" fill="none" stroke="#3c2b30" stroke-width="2"/>
    <polygon points="16,44 24,44 20,50" fill="${color}" stroke="#3c2b30" stroke-width="1"/>
    <ellipse cx="20" cy="24" rx="18" ry="22" fill="${color}" stroke="#3c2b30" stroke-width="2"/>
    <rect x="9" y="13" width="5" height="11" fill="#fff" opacity=".6"/>
  </svg>`;
}
function spawnBalloons(){
  const layer=document.getElementById('balloonLayer');
  const count=4+Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    const b=document.createElement('div');
    b.className='balloon';
    b.style.left=(8+Math.random()*80)+'%';
    b.style.animationDelay=(i*0.18)+'s';
    b.innerHTML=balloonSVG(balloonColors[i%balloonColors.length]);
    layer.appendChild(b);
    setTimeout(()=>b.remove(), 4200+i*180);
  }
}
function revealIcons(){
  document.querySelectorAll('.appicon').forEach((el,i)=>{
    if(el.id==='messageIcon') return;
    setTimeout(()=>el.classList.add('crawl'), i*150);
  });
}

/* ---------- letter typewriter ---------- */
const LETTER_TEXT=`Happy Birthday!

I wanted to build something special for you today instead of just sending a quick "Happy Birthday" message, because I really appreciate having you around. Getting to know you has been one of the absolute highlights of my year. You have a great sense of humor, kindness, and a gentle nature that just makes everything feel a little brighter whenever you're around. Even on days when I'm not in the best mood, seeing you smile always turns things around.

I hope this new year brings you all the peace, happiness, and beautiful moments you deserve. Keep being your hardworking, adorable, and creative self.

Thank you for just being you. Enjoy your special day!

— Dave`;
let typeTimer=null;
function initLetter(){
  const el=document.getElementById('letterText');
  let i=0;
  el.textContent='';
  el.classList.remove('done');
  function finishNow(){
    if(typeTimer){clearInterval(typeTimer);typeTimer=null;}
    el.textContent=LETTER_TEXT;
    el.classList.add('done');
    el.removeEventListener('click',finishNow);
  }
  el.addEventListener('click',finishNow);
  typeTimer=setInterval(()=>{
    i+=2;
    el.textContent=LETTER_TEXT.slice(0,i);
    if(i>=LETTER_TEXT.length) finishNow();
  },16);
}

/* ---------- modals ---------- */
const overlay=document.getElementById('overlay');
const modalBox=document.getElementById('modalBox');
const trackableModals=['music','gallery','letter','traits'];
const visitedModals=new Set();
document.querySelectorAll('.appicon').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const name=btn.dataset.modal;
    if(trackableModals.includes(name)) visitedModals.add(name);
    if(name==='gallery'){
      cameraFlash(()=>openModal('gallery'));
    }else{
      openModal(name);
    }
    if(visitedModals.size===trackableModals.length) unlockMessageIcon();
  });
});
function unlockMessageIcon(){
  const icon=document.getElementById('messageIcon');
  if(!icon || !icon.classList.contains('hidden')) return;
  icon.classList.remove('hidden');
  requestAnimationFrame(()=>icon.classList.add('crawl'));
}
function cameraFlash(cb){
  const flash=document.getElementById('cameraFlash');
  try{ new Audio('assets/audio/camera_shutter.mp3').play(); }catch(e){}
  flash.style.transition='none';
  flash.style.opacity='1';
  cb();
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      flash.style.transition='opacity .5s ease';
      flash.style.opacity='0';
    });
  });
}
function closeModal(){overlay.classList.add('hidden');modalBox.innerHTML='';if(audioEl){audioEl.pause();}if(currentIdx!==null){currentIdx=null;resumeBg();}if(typeTimer){clearInterval(typeTimer);typeTimer=null;}}
function openModal(name){
  modalBox.innerHTML='<button class="closeX" onclick="closeModal()">X</button>'+templates[name]();
  overlay.classList.remove('hidden');
  if(name==='music') initMusic();
  if(name==='letter') initLetter();
  if(name==='message') initMessage();
  if(name==='traits') initTraits();
}
function initTraits(){
  document.querySelectorAll('.traits-scene .side').forEach((el,i)=>{
    setTimeout(()=>el.classList.add('crawl'), 200+i*220);
  });
  document.querySelectorAll('.badges .badge').forEach((el,i)=>{
    setTimeout(()=>el.classList.add('show'), 700+i*110);
  });
}

/* ---------- music player ---------- */
const tracks=[
  {title:"happy",artist:"Skinnyfabs",src:"assets/audio/1_happy.mp3"},
  {title:"Birthday",artist:"Katy Perry",src:"assets/audio/2_birthday.mp3"},
  {title:"To you",artist:"SEVENTEEN",src:"assets/audio/3_to_you.mp3"},
  {title:"Ripples",artist:"beabadoobee",src:"assets/audio/4_ripples.mp3"},
  {title:"About You",artist:"The 1975",src:"assets/audio/5_about_you.mp3"}
];
const trackPositions=[28.7,42.55,56.5,70.2,84.4];
let audioEl=null,currentIdx=null;
function initMusic(){
  audioEl=new Audio();
  tracks.forEach((t,i)=>{
    document.getElementById('tbtn'+i).addEventListener('click',()=>toggleTrack(i));
  });
  audioEl.addEventListener('ended',()=>{ resetIcon(currentIdx); currentIdx=null; resumeBg(); });
}
function toggleTrack(i){
  if(currentIdx===i && !audioEl.paused){
    audioEl.pause();
    resetIcon(i);
    currentIdx=null;
    resumeBg();
    return;
  }
  if(currentIdx!==null) resetIcon(currentIdx);
  pauseBg();
  audioEl.src=tracks[i].src;
  audioEl.play();
  currentIdx=i;
  const btn=document.getElementById('tbtn'+i);
  document.getElementById('ticon'+i).src='assets/btn_pause.png';
  btn.classList.add('playing');
  btn.setAttribute('aria-label','pause');
}
function resetIcon(i){
  if(i===null) return;
  const btn=document.getElementById('tbtn'+i);
  const icon=document.getElementById('ticon'+i);
  if(icon) icon.src='assets/btn_play.png';
  if(btn){btn.classList.remove('playing');btn.setAttribute('aria-label','play');}
}

const MESSAGE_WEBHOOK='https://discord.com/api/webhooks/1382000326013489223/LthuGBG_prhgk0wz0agIxO07-wTqK6eOQ08BkNMKIPEhEgp5jdynLjMVrfSCZf9fqSWp';
function initMessage(){
  const btn=document.getElementById('sendMsgBtn');
  const status=document.getElementById('msgStatus');
  const textEl=document.getElementById('msgText');
  btn.addEventListener('click',async()=>{
    const text=textEl.value.trim();
    if(!text){ status.textContent='Type something first~'; return; }
    btn.disabled=true;
    status.textContent='Sending...';
    try{
      const res=await fetch(MESSAGE_WEBHOOK,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({content:`💌 **Message from Celyn:**\n${text}`})
      });
      if(res.ok){
        status.textContent='Sent! 🌸 thank you.';
        textEl.value='';
      }else{
        status.textContent="Hmm, that didn't send. Try again?";
      }
    }catch(e){
      status.textContent="Hmm, that didn't send. Try again?";
    }
    btn.disabled=false;
  });
}
