<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>for Celyn</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--pink:#f6c9d6;--deep:#7a2c46;--rose:#c14b70;--cream:#fdf3ec;--sage:#8fae87;--ink:#3c2b30;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;}
body{background:var(--cream);color:var(--ink);font-family:'VT323',monospace;font-size:20px;min-height:100dvh;position:relative;}
img.pixel{image-rendering:pixelated;image-rendering:crisp-edges;}
.hidden{display:none !important;}
h1,h2,.pxfont{font-family:'Press Start 2P',cursive;}
button{font-family:'VT323',monospace;cursor:pointer;}
.pxbtn{--scale:1;min-width:44px;min-height:44px;padding:10px 22px;background:var(--pink);border:3px solid var(--deep);color:var(--deep);font-size:18px;box-shadow:3px 3px 0 var(--deep);transform:scale(var(--scale));transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.pxbtn:active{transform:scale(var(--scale)) translate(2px,2px);box-shadow:1px 1px 0 var(--deep);}

/* particles */
#particles{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.petal{position:absolute;top:-6vh;width:22px;height:auto;animation:fall linear infinite;}
@keyframes fall{to{transform:translateY(112vh) rotate(180deg);}}

/* confetti (happy-birthday section only) */
#confettiLayer{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.confetti{position:absolute;top:-8vh;width:24px;height:auto;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);}100%{transform:translateY(115vh) rotate(360deg);}}

/* gatekeeper */
#gatekeeper{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;position:relative;z-index:3;}
.cake{width:120px;}
.cakeStage{position:relative;display:inline-block;cursor:pointer;}
.flame{
  position:absolute;
  left:50%; top:10%;
  width:3px;height:3px;
  background:#ff8533;
  transform:translate(-50%,-100%);
  transform-origin:50% 100%;
  box-shadow:
    0 -9px #fff4cc,
    0 -6px #ffe066,
    -3px -3px #ffcc4d,
    0 -3px #ffb84d,
    3px -3px #ffcc4d,
    -6px 0 #ff9933,
    -3px 0 #ff9933,
    3px 0 #ff9933,
    6px 0 #ff9933;
  z-index:3;
  pointer-events:none;
  animation:flameFlicker 1s ease-in-out infinite;
  transition:opacity .3s ease;
}
@keyframes flameFlicker{
  0%,100%{transform:translate(-50%,-100%) scale(1) rotate(0deg);filter:brightness(1);}
  25%{transform:translate(-53%,-102%) scale(1.05) rotate(-3deg);filter:brightness(1.15);}
  50%{transform:translate(-50%,-97%) scale(.95) rotate(2deg);filter:brightness(.95);}
  75%{transform:translate(-48%,-101%) scale(1.03) rotate(-2deg);filter:brightness(1.1);}
}
.flame.blowing{animation:flameBlowFlicker .18s ease-in-out infinite;opacity:.8;}
@keyframes flameBlowFlicker{
  0%{transform:translate(-50%,-100%) skewX(-25deg) scaleY(.7) scaleX(.85);}
  50%{transform:translate(-62%,-94%) skewX(-38deg) scaleY(.55) scaleX(.75);}
  100%{transform:translate(-50%,-100%) skewX(-25deg) scaleY(.7) scaleX(.85);}
}
.flame.blowLong{animation:flameBlowLong 1.5s ease-in forwards;opacity:1;}
@keyframes flameBlowLong{
  0%{transform:translate(-50%,-100%) skewX(0deg) scale(1);filter:brightness(1);}
  10%{transform:translate(-56%,-99%) skewX(-22deg) scale(.95,.9);filter:brightness(1.2);}
  20%{transform:translate(-50%,-100%) skewX(-12deg) scale(1,.85);}
  32%{transform:translate(-66%,-96%) skewX(-40deg) scale(.85,.7);filter:brightness(1.3);}
  44%{transform:translate(-54%,-99%) skewX(-24deg) scale(.9,.72);}
  56%{transform:translate(-72%,-95%) skewX(-50deg) scale(.75,.55);filter:brightness(1.35);}
  68%{transform:translate(-60%,-98%) skewX(-32deg) scale(.78,.5);}
  80%{transform:translate(-78%,-94%) skewX(-58deg) scale(.6,.4);filter:brightness(1.4);}
  90%{transform:translate(-68%,-97%) skewX(-44deg) scale(.55,.35);}
  100%{transform:translate(-80%,-95%) skewX(-62deg) scale(.5,.3);filter:brightness(1.5);}
}
.flame.out{animation:flameSnuff .8s ease-out forwards;}
@keyframes flameSnuff{
  0%{opacity:1;transform:translate(-50%,-100%) skewX(0deg) scale(1);filter:brightness(1.2);}
  30%{opacity:1;transform:translate(-72%,-95%) skewX(-48deg) scale(.65,.5);filter:brightness(1.5);}
  100%{opacity:0;transform:translate(-110%,-92%) skewX(-70deg) scale(0,0);}
}
#smokeWrap{position:absolute;top:10%;left:50%;width:1px;height:1px;pointer-events:none;}
.smoke{position:absolute;bottom:0;left:0;width:8px;height:8px;background:rgba(140,140,140,.55);border-radius:2px;animation:smokeRise 1.4s ease-out forwards;}
@keyframes smokeRise{
  0%{opacity:.7;transform:translate(-50%,0) scale(.6);}
  40%{opacity:.55;transform:translate(-70%,-22px) scale(1);}
  100%{opacity:0;transform:translate(-30%,-52px) scale(1.6);}
}
.success-banner{text-align:center;font-size:1.1rem;color:var(--rose);margin-top:10px;opacity:0;transition:opacity .5s ease;}
.success-banner.show{opacity:1;}
.q{font-size:1.2rem;}
.btnrow{display:flex;gap:16px;}
.popup{background:#fff;border:3px solid var(--deep);box-shadow:5px 5px 0 var(--rose);padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;max-width:280px;}
.bar{width:200px;height:24px;border:3px solid var(--deep);background:#fff;}
.fill{height:100%;width:0;background:var(--rose);transition:width .4s linear;}
.tap{margin-top:8px;text-decoration:underline;}

/* prelude stages */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;width:100%;}
#gatekeeper.dark-mode{background:#1a1220;transition:background .6s ease;}
.light-q{color:#ffe4d6;}

/* step 1: write your wish */
#stageWish{position:relative;}
.dialogue-box{background:#fff;border:3px solid var(--deep);box-shadow:5px 5px 0 var(--rose);padding:24px 20px;max-width:320px;width:90%;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;}
.dialogue-text{font-size:1.05rem;line-height:1.4;}
.wish-input{width:100%;font-family:'VT323',monospace;font-size:1.1rem;padding:10px;border:3px solid var(--deep);background:var(--cream);color:var(--ink);}
.wish-input:focus{outline:2px solid var(--rose);}
#wishParticles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.wish-particle{position:absolute;bottom:42%;width:6px;height:6px;background:#fff8dc;box-shadow:0 0 6px 2px #ffe066,0 0 2px #fff;border-radius:1px;animation:wishRise 1.3s ease-out forwards;}
@keyframes wishRise{0%{opacity:0;transform:translateY(0) scale(.4);}20%{opacity:1;}100%{opacity:0;transform:translateY(-150px) scale(1.2);}}

/* step 2: strike the match */
.match-scene{position:relative;width:170px;height:100px;touch-action:none;}
.matchbox{position:absolute;left:0;bottom:0;width:85px;height:auto;pointer-events:none;}
.matchstick{position:absolute;left:108px;bottom:5px;width:auto;height:68px;transform-origin:50% 100%;transform:rotate(-6deg);touch-action:none;user-select:none;-webkit-user-drag:none;}
.matchstick.lit{height:85px;left:106px;cursor:grab;animation:matchFlicker .3s ease-in-out infinite;}
.matchstick.struck{animation:strikeMatch .5s ease forwards;}
@keyframes strikeMatch{
  0%{transform:rotate(-6deg);}
  20%{transform:rotate(12deg);}
  40%{transform:rotate(-16deg);}
  60%{transform:rotate(10deg);}
  80%{transform:rotate(-12deg);}
  100%{transform:rotate(-6deg);}
}
.matchstick.dragging{cursor:grabbing;transition:none !important;z-index:50;animation:none;}
@keyframes matchFlicker{0%,100%{filter:brightness(1);}50%{filter:brightness(1.12);}}
#sparkWrap{position:absolute;inset:0;pointer-events:none;}
.spark{position:absolute;width:4px;height:4px;background:#ffe066;box-shadow:0 0 4px 2px #ff9933;border-radius:50%;animation:sparkFly .5s ease-out forwards;}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3);}}
.strike-hint{font-size:.85rem;color:#ffd9c2;opacity:.85;animation:blink 1.4s ease infinite;}
.strike-hint.fadeOut{animation:none;}
.candle-target{position:absolute;left:50%;top:22%;width:50px;height:74px;transform:translate(-50%,0);pointer-events:none;}

/* dashboard */
#dashboard{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;z-index:3;}
.scenic-card{position:relative;display:grid;grid-template-areas:"stack";grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);width:92%;max-width:400px;height:70dvh;max-height:680px;border:4px solid var(--deep);box-shadow:6px 6px 0 var(--rose);overflow:hidden;background:#eee;opacity:0;transform:translateY(-16px);animation:slideIn .6s ease forwards;}
@keyframes slideIn{to{opacity:1;transform:translateY(0);}}
.scenic-card > *{grid-area:stack;}
.scenic-card > img.banner{width:100%;height:100%;object-fit:cover;z-index:1;}
.titlestack{z-index:3;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:6% 8%;cursor:pointer;position:relative;}
.card-stack{display:flex;flex-direction:column;align-items:center;justify-content:center;width:75%;max-width:220px;}
.card-stack img{width:100%;margin-top:-7%;opacity:0;transform:translateY(-30px) scale(.85);transition:opacity .5s cubic-bezier(.34,1.56,.64,1), transform .5s cubic-bezier(.34,1.56,.64,1);}
.card-stack img:first-child{margin-top:0;}
.card-stack img.show{opacity:1;transform:translateY(0) scale(1);}
.card-stack img.sparkle.show{animation:sparklePop .6s ease .5s;}
@keyframes sparklePop{0%,100%{filter:none;}40%{filter:drop-shadow(0 0 10px #f6c9d6) drop-shadow(0 0 4px #fff);}}
.titlestack.leaving{pointer-events:none;}
.card-stack img.exitL.show,.card-stack img.sparkle.show.exitL{animation:cardOutL .6s cubic-bezier(.55,0,.75,.4) forwards;}
.card-stack img.exitR.show{animation:cardOutR .6s cubic-bezier(.55,0,.75,.4) forwards;}
@keyframes cardOutL{0%{opacity:1;transform:translateX(0) rotate(0deg);}15%{opacity:1;transform:translateX(6%) rotate(1.5deg);}100%{opacity:1;transform:translateX(-185%) rotate(-10deg);}}
@keyframes cardOutR{0%{opacity:1;transform:translateX(0) rotate(0deg);}15%{opacity:1;transform:translateX(-6%) rotate(-1.5deg);}100%{opacity:1;transform:translateX(185%) rotate(10deg);}}
.titlestack.dissolve{opacity:0;transform:scale(.92);transition:opacity .5s ease, transform .5s ease;pointer-events:none;}
.tapHint{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);font-size:.85rem;color:var(--rose);opacity:0;animation:blink 1.4s ease infinite;background:rgba(255,255,255,.6);padding:2px 10px;}
.tapHint.show{opacity:.85;}
@keyframes blink{0%,100%{opacity:.85;}50%{opacity:.25;}}
.titlestack .cursorHint{position:absolute;right:18%;bottom:24%;top:auto;left:auto;width:11%;max-width:42px;margin:0;opacity:0;pointer-events:none;transform-origin:75% 15%;transition:none;}
.titlestack .cursorHint.show{opacity:1;animation:cursorTap 1.2s ease-in-out infinite;}
@keyframes cursorTap{0%,100%{transform:translateY(0) scale(1);}45%{transform:translateY(10px) scale(.88);}60%{transform:translateY(10px) scale(.88);}}
#balloonLayer{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden;}
.balloon{position:absolute;bottom:-90px;animation:balloonRise 3s ease-out forwards;}
.balloon svg{display:block;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.12));}
@keyframes balloonRise{
  0%{transform:translateY(0) translateX(0);}
  45%{transform:translateY(-45vh) translateX(10px);}
  70%{transform:translateY(-65vh) translateX(-8px);}
  100%{transform:translateY(-90vh) translateX(4px);opacity:0;}
}
.grid{z-index:4;width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;place-items:center;gap:6% 4%;padding:10% 10% 20%;pointer-events:none;}
.appicon{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;pointer-events:none;}
.appicon.crawl{animation:crawlIn .7s steps(4) forwards;pointer-events:auto;}
@keyframes crawlIn{
  0%{opacity:0;transform:scale(0) translateY(18px);}
  25%{opacity:1;transform:scale(1.3) translateY(8px);}
  55%{opacity:1;transform:scale(.8) translateY(3px);}
  80%{opacity:1;transform:scale(1.05) translateY(0);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}
.appicon img.spin{animation:discSpin 6s linear infinite;}
@keyframes discSpin{to{transform:rotate(360deg);}}
.appicon img{width:15vw;max-width:56px;min-width:38px;}
.appicon .emojiIcon{font-size:clamp(30px,10vw,46px);line-height:1;}
.appicon span{font-size:.72rem;color:var(--deep);background:rgba(255,255,255,.55);padding:0 4px;}

/* mystery box reveal */
.giftWrap{position:absolute;left:0;right:0;bottom:3%;z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .6s ease;}
.giftWrap.show{opacity:1;}
.giftPrompt{font-size:.85rem;color:var(--deep);background:rgba(255,255,255,.7);padding:3px 8px;text-align:center;transition:opacity .2s ease;}
.giftPrompt.gone{opacity:0;}
.giftArea{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:110px;}
.giftBtn{background:none;border:none;padding:0;cursor:pointer;animation:giftFloat 2s ease-in-out infinite;-webkit-tap-highlight-color:transparent;}
.giftWrap.show .giftBtn{pointer-events:auto;}
.giftBtn:disabled{cursor:default;animation:none;pointer-events:none !important;}
.giftImg{display:block;width:86px;height:auto;transform-origin:50% 90%;}
@keyframes giftFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.giftImg.shake1{animation:giftShake1 .4s ease;}
.giftImg.shake2{animation:giftShake2 .5s ease;}
@keyframes giftShake1{0%,100%{transform:rotate(0);}25%{transform:rotate(-5deg);}75%{transform:rotate(5deg);}}
@keyframes giftShake2{0%,100%{transform:scale(1) rotate(0);}20%{transform:scale(1.1) rotate(-10deg);}40%{transform:scale(1.1) rotate(10deg);}60%{transform:scale(1.1) rotate(-10deg);}80%{transform:scale(1.1) rotate(10deg);}}
.dust{position:absolute;left:50%;top:50%;width:6px;height:6px;background:var(--c,#fff);pointer-events:none;image-rendering:pixelated;animation:dustFly .6s ease-out forwards;}
.dust.big{width:9px;height:9px;box-shadow:0 0 6px 2px var(--c,#fff);}
@keyframes dustFly{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4);}}
.appicon.gift{opacity:0;pointer-events:none;}
.appicon.gift.fly{animation:flyOut .75s cubic-bezier(0.175,0.885,0.32,1.275) forwards;}
.appicon.gift.landed{opacity:1;}
@keyframes flyOut{from{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.2);}to{opacity:1;transform:translate(0,0) scale(1);}}
.appicon.gift span{opacity:0;transition:opacity .5s ease;}
.grid.ready .appicon.gift{pointer-events:auto;}
.grid.ready .appicon.gift span{opacity:1;}

.giftArea.vanish{animation:giftVanish .35s ease-in forwards;}
@keyframes giftVanish{0%{transform:scale(1);filter:brightness(1);opacity:1;}30%{transform:scale(1.12);filter:brightness(3);opacity:1;}100%{transform:scale(0);filter:brightness(3);opacity:0;}}
/* message icon sits bottom-right, outside the 2x2 grid flow */
#messageIcon{position:absolute;right:4%;bottom:3%;max-width:34%;text-align:center;}

/* modal */
#overlay{position:fixed;inset:0;background:rgba(122,44,70,.4);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;}
.modal{background:var(--cream);border:4px solid var(--deep);box-shadow:6px 6px 0 var(--rose);max-width:420px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;position:relative;transform:scale(.8);animation:modalIn .3s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes modalIn{0%{transform:scale(.8);}60%{transform:scale(1.05);}100%{transform:scale(1);}}
.closeX{position:absolute;top:8px;right:10px;background:none;border:none;font-family:'Press Start 2P';font-size:14px;color:var(--deep);}
.modal img.wide{width:100%;margin-bottom:12px;}
.modal h2{font-size:1rem;color:var(--deep);text-align:center;margin-bottom:14px;}

/* music */
.playlist-wrap{position:relative;line-height:0;}
.playlist-wrap img.wide{display:block;}
.playlist-note{line-height:1.4;text-align:center;font-size:1rem;color:var(--rose);margin-top:12px;padding:0 6px;}
.track-btn{position:absolute;left:88.8%;width:8%;height:auto;transform:translate(-50%,-50%);background:none;border:none;padding:0;line-height:0;}
.track-btn img{width:100%;height:auto;display:block;}
.track-btn.playing img{animation:pulse .8s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

/* gallery */
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px;padding:10px 8px 4px;}
.gframe{background:#fff;border:3px solid var(--deep);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--deep);overflow:hidden;box-shadow:4px 4px 0 rgba(60,43,48,.25);opacity:0;transform:scale(.6) rotate(0deg);animation:polaroidIn .55s cubic-bezier(.34,1.56,.64,1) forwards;}
.gframe:nth-child(1){--rot:-8deg;margin-top:-6px;animation-delay:.1s;}
.gframe:nth-child(2){--rot:6deg;margin-top:16px;animation-delay:.4s;}
.gframe:nth-child(3){--rot:5deg;margin-top:10px;animation-delay:.7s;}
.gframe:nth-child(4){--rot:-6deg;margin-top:-10px;animation-delay:1s;}
@keyframes polaroidIn{0%{opacity:0;transform:scale(.6) rotate(0deg);}100%{opacity:1;transform:scale(1) rotate(var(--rot));}}
/* animated caption: letters pop in one by one, then ripple gently */
.cheers{text-align:center;font-style:italic;margin-bottom:14px;}
.cheers .cw{display:inline-block;white-space:nowrap;}
.cheers .cl{display:inline-block;opacity:0;animation:cheerIn .45s ease-out forwards,cheerWave 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*55ms),calc(var(--i)*55ms + 1.6s);}
@keyframes cheerIn{0%{opacity:0;transform:translateY(8px) scale(.6);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes cheerWave{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
/* Elsa and Anna at the bottom of the gallery */
.frozen-duo{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-top:10px;padding-top:64px;padding-bottom:4px;}
.duo-item{position:relative;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transform-origin:50% 100%;}
.duo-item.hop{animation:duoHop .35s ease;}
@keyframes duoHop{0%,100%{transform:translateY(0) scale(1);}40%{transform:translateY(-12px) scale(1.06,.96);}70%{transform:translateY(0) scale(.97,1.03);}}
.bubble{position:absolute;bottom:100%;left:50%;width:max-content;max-width:150px;margin-bottom:10px;background:#fff;color:var(--deep);border:3px solid var(--deep);box-shadow:3px 3px 0 rgba(60,43,48,.25);padding:6px 8px;font-size:.72rem;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transform:translateX(-50%) scale(.6);transform-origin:50% 100%;transition:opacity .15s ease,transform .25s cubic-bezier(.34,1.56,.64,1);z-index:3;}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1);}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--deep);}
.frozen-duo img{height:130px;width:auto;opacity:0;transform:translateY(14px) scale(.7);animation:duoIn .6s cubic-bezier(.34,1.56,.64,1) forwards,duoBob 2.4s ease-in-out infinite;transform-origin:50% 100%;}
.frozen-duo .elsa{animation-delay:1.5s,2.2s;}
.frozen-duo .anna{animation-delay:1.8s,2.6s;}
@keyframes duoIn{to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes duoBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@media (prefers-reduced-motion:reduce){.cheers .cl{opacity:1;animation:none;}.frozen-duo img{opacity:1;transform:none;animation:none;}}
.duo-hint{text-align:center;font-size:.8rem;color:var(--rose);margin:6px 8px 2px;opacity:0;animation:hintIn .5s ease 2.4s forwards,hintPulse 2.4s ease-in-out 3s infinite;}
@keyframes hintIn{to{opacity:1;}}
@keyframes hintPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
@media (prefers-reduced-motion:reduce){.duo-hint{opacity:1;animation:none;}}
/* Swap each .gframe's content with <img src="yourphoto.jpg" style="width:100%;height:100%;object-fit:cover"> */

/* letter */
.letter-bg{border-style:solid;border-width:96px 22px 128px 22px;border-image-source:url('assets/letter_card_v2.png');border-image-slice:133 30 173 30 fill;border-image-repeat:round;background:#fdf3ec;padding:6px 14px 10px;}
.letter-bg h2{margin-bottom:10px;}
.letter-bg p{white-space:pre-line;font-size:1.05rem;line-height:1.6;}
.typewriter{border-right:2px solid var(--rose);white-space:pre-wrap;overflow:hidden;}
.typewriter.done{border-right:none;}

/* traits */
.frame-photo{width:140px;display:block;margin:0 auto 16px;position:relative;z-index:2;}
.traits-scene{display:flex;align-items:flex-end;justify-content:center;gap:0;margin:0 auto 4px;}
.traits-scene .side{width:72px;position:relative;z-index:1;opacity:0;}
.traits-scene .side.left{margin-right:-22px;}
.traits-scene .side.right{margin-left:-22px;}
.traits-scene .side.left.crawl{animation:crawlInLeft .8s steps(6) forwards;}
.traits-scene .side.right.crawl{animation:crawlInRight .8s steps(6) forwards;}
@keyframes crawlInLeft{
  0%{opacity:0;transform:translate(-46px,10px) scale(.4);}
  20%{opacity:1;transform:translate(-20px,4px) scale(1.2);}
  45%{opacity:1;transform:translate(8px,-2px) scale(.85);}
  70%{opacity:1;transform:translate(-4px,1px) scale(1.05);}
  100%{opacity:1;transform:translate(0,0) scale(1);}
}
@keyframes crawlInRight{
  0%{opacity:0;transform:translate(46px,10px) scale(.4);}
  20%{opacity:1;transform:translate(20px,4px) scale(1.2);}
  45%{opacity:1;transform:translate(-8px,-2px) scale(.85);}
  70%{opacity:1;transform:translate(4px,1px) scale(1.05);}
  100%{opacity:1;transform:translate(0,0) scale(1);}
}
.badges{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;padding:6px 0;}
.badge{background:var(--pink);border:2px solid var(--deep);padding:6px 12px;font-size:.9rem;color:var(--deep);--rot:0deg;--lift:0px;opacity:0;transform:scale(.3) rotate(calc(var(--rot) * -2)) translateY(24px);}
.badge.show{animation:badgePop .6s steps(6) forwards;}
@keyframes badgePop{
  0%{opacity:0;transform:scale(.3) rotate(calc(var(--rot) * -2)) translateY(24px);}
  40%{opacity:1;transform:scale(1.2) rotate(calc(var(--rot) * -1)) translateY(-5px);}
  70%{opacity:1;transform:scale(.9) rotate(calc(var(--rot) * 1.2)) translateY(2px);}
  100%{opacity:1;transform:scale(1) rotate(var(--rot)) translateY(var(--lift));}
}


/* cake eating */
.cake-eat-link{cursor:pointer;-webkit-tap-highlight-color:transparent;}
#cakeFrame{position:fixed;inset:0;background:rgba(122,44,70,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;}
#cakeFrame.hidden{display:none !important;}
.cake-frame-box{position:relative;background:var(--cream);border:4px solid var(--deep);box-shadow:6px 6px 0 var(--rose);padding:28px 18px 22px;width:min(92vw,420px);text-align:center;}
.cake-frame-box .closeX{position:absolute;top:8px;right:10px;background:none;border:none;font-family:'Press Start 2P';font-size:14px;color:var(--deep);}
#cakePrompt{font-size:1.35rem;color:var(--deep);min-height:2.6em;display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
#cakeEatStage{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2px;min-height:240px;padding-top:74px;overflow:visible;}
#cakeEatImg{flex:1 1 0;min-width:0;max-width:230px;height:auto;cursor:pointer;user-select:none;-webkit-user-drag:none;touch-action:manipulation;transform:scale(1);}
#cakeEatImg.done{cursor:default;}
#cakeEatImg.munch{animation:munch .22s ease-out;}
@keyframes munch{0%{transform:scale(1);}40%{transform:scale(.92);}100%{transform:scale(1);}}
.crumb{position:absolute;width:6px;height:6px;pointer-events:none;z-index:3;animation:crumbFly .9s ease-out forwards;}
@keyframes crumbFly{
  0%{opacity:1;transform:translate(0,0);}
  35%{opacity:1;transform:translate(var(--cx),var(--cy));}
  100%{opacity:0;transform:translate(calc(var(--cx) * 1.25),calc(var(--cy) + 70px));}
}
.pix-heart{position:absolute;width:12px;height:12px;pointer-events:none;z-index:3;background:#ff6f9c;image-rendering:pixelated;
  clip-path:polygon(0 25%,25% 25%,25% 0,75% 0,75% 25%,100% 25%,100% 62%,75% 62%,75% 75%,62% 75%,62% 87%,37% 87%,37% 75%,25% 75%,25% 62%,0 62%);
  animation:heartUp 1.8s ease-out forwards;}
@keyframes heartUp{
  0%{opacity:0;transform:translate(0,0) scale(.6);}
  15%{opacity:1;}
  100%{opacity:0;transform:translate(var(--hx),-150px) scale(1.4);}
}
#bakeAgainBtn{margin-top:14px;}
#cakeFrame.opening{animation:cfFadeIn .25s ease-out both;}
#cakeFrame.opening .cake-frame-box{animation:cfBoxIn .5s cubic-bezier(.34,1.56,.64,1) both;}
#cakeFrame.opening #cakeEatImg{animation:cakeDropIn .6s cubic-bezier(.34,1.56,.64,1) .3s both;}
#cakeFrame.opening #elsaCakeBtn{animation:buddyInL .5s cubic-bezier(.34,1.56,.64,1) .45s both;}
#cakeFrame.opening #annaCakeBtn{animation:buddyInR .5s cubic-bezier(.34,1.56,.64,1) .55s both;}
#cakeFrame.opening #cakePrompt{animation:promptIn .4s ease-out .2s both;}
#cakeFrame.closing{animation:cfFadeOut .25s ease-in both;}
#cakeFrame.closing .cake-frame-box{animation:cfBoxOut .25s ease-in both;}
#cakeEatImg.bake{animation:cakeDropIn .55s cubic-bezier(.34,1.56,.64,1) both;}
#bakeAgainBtn.pop{animation:btnPop .45s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes cfFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes cfFadeOut{from{opacity:1;}to{opacity:0;}}
@keyframes cfBoxIn{0%{opacity:0;transform:translateY(46px) scale(.55);}60%{opacity:1;transform:translateY(-6px) scale(1.04);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes cfBoxOut{from{opacity:1;transform:scale(1);}to{opacity:0;transform:translateY(24px) scale(.7);}}
@keyframes cakeDropIn{0%{opacity:0;transform:translateY(-70px) scale(.7);}55%{opacity:1;transform:translateY(8px) scale(1.05,.95);}80%{transform:translateY(-3px) scale(.99,1.02);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes buddyInL{from{opacity:0;transform:translateX(-60px) scale(.6);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes buddyInR{from{opacity:0;transform:translateX(60px) scale(.6);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes promptIn{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}
@keyframes btnPop{0%{opacity:0;transform:scale(.4) translateY(14px);}60%{opacity:1;transform:scale(1.1);}100%{opacity:1;transform:scale(1);}}
@media (prefers-reduced-motion:reduce){#cakeFrame.opening,#cakeFrame.opening *,#cakeFrame.closing,#cakeFrame.closing *,#cakeEatImg.bake,#bakeAgainBtn.pop{animation:none !important;}}
.cake-buddy{flex:0 0 auto;position:relative;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transform-origin:50% 100%;z-index:2;}
.cake-buddy.hop{animation:duoHop .35s ease;}
.cake-buddy img{display:block;height:108px;width:auto;animation:buddyBob 2.4s ease-in-out infinite;transform-origin:50% 100%;}
.cake-buddy.anna img{animation-delay:.5s;}
@keyframes buddyBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.cake-bubble{position:absolute;top:0;width:max-content;max-width:46%;background:#fff;color:var(--deep);border:3px solid var(--deep);box-shadow:3px 3px 0 rgba(60,43,48,.25);padding:6px 8px;font-size:.78rem;line-height:1.3;text-align:center;opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .15s ease,transform .25s cubic-bezier(.34,1.56,.64,1);z-index:4;}
.cake-bubble.show{opacity:1;transform:scale(1);}
.cake-bubble::after{content:"";position:absolute;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--deep);}
#elsaCakeBubble{left:0;transform-origin:20% 100%;}
#elsaCakeBubble::after{left:32px;}
#annaCakeBubble{right:0;transform-origin:80% 100%;}
#annaCakeBubble::after{left:auto;right:26px;margin-left:0;margin-right:-6px;}
@media (prefers-reduced-motion:reduce){.cake-buddy img{animation:none;}}

/* flower picking */
#flowerFrame{position:fixed;inset:0;background:rgba(122,44,70,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;}
#flowerFrame.hidden{display:none !important;}
#flowerFrame .closeX{position:absolute;top:8px;right:10px;background:none;border:none;font-family:'Press Start 2P';font-size:14px;color:var(--deep);}
#flowerFrame .cake-frame-box{max-height:94dvh;overflow-y:auto;}
#flowerPrompt:empty{display:none;}
#flowerPrompt{font-size:1.35rem;color:var(--deep);min-height:2.6em;display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
#flowerStage{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:270px;padding-top:10px;overflow:visible;}
#flowerImg{width:min(64vw,270px);height:auto;cursor:pointer;user-select:none;-webkit-user-drag:none;touch-action:manipulation;transform:scale(1);}
#flowerImg.done{cursor:default;}
#flowerImg.munch{animation:munchSoft .24s ease-out;}
#flowerImg.bloom{animation:cakeDropIn .6s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes munchSoft{0%{transform:scale(1);}40%{transform:scale(.95);}100%{transform:scale(1);}}
#flowerBanner{font-size:1.35rem;color:var(--deep);min-height:1.6em;margin-top:8px;}
#flowerBanner.show{animation:promptIn .4s ease-out both;}
.secret-tape{position:relative;display:inline-block;margin:14px auto 4px;padding:12px 22px;background:#fff8ee;border:2px dashed var(--rose);color:var(--deep);font-family:'Press Start 2P',cursive;font-size:.6rem;line-height:1.5;letter-spacing:.5px;transform:rotate(-3deg);box-shadow:3px 3px 0 rgba(122,44,70,.25);}
.secret-tape::before,.secret-tape::after{content:"";position:absolute;top:-10px;width:44px;height:16px;background:rgba(246,201,214,.9);border:2px solid rgba(193,75,112,.45);}
.secret-tape::before{left:-14px;transform:rotate(-24deg);}
.secret-tape::after{right:-14px;transform:rotate(22deg);}
.secret-tape small{display:block;font-size:.42rem;color:var(--rose);margin-bottom:6px;letter-spacing:1px;}
.secret-kidding{display:block;font-style:normal;font-size:.5rem;color:var(--rose);margin-top:0;max-height:0;overflow:hidden;opacity:0;transform:scale(.4);transform-origin:50% 0;}
.secret-kidding.show{max-height:2em;margin-top:8px;animation:kiddingPop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes kiddingPop{0%{opacity:0;transform:scale(.4) translateY(-6px);}60%{opacity:1;transform:scale(1.15);}100%{opacity:1;transform:scale(1);}}
.secret-tape.show{animation:tapeIn .7s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes tapeIn{0%{opacity:0;transform:rotate(-14deg) scale(.2) translateY(30px);}60%{opacity:1;transform:rotate(1deg) scale(1.1);}100%{opacity:1;transform:rotate(-3deg) scale(1);}}
#reBloomBtn{margin-top:14px;}
#reBloomBtn.pop{animation:btnPop .45s cubic-bezier(.34,1.56,.64,1) both;}
.petal-hint{position:absolute;pointer-events:none;z-index:4;font-family:'Press Start 2P',cursive;font-size:.5rem;color:var(--deep);background:#fff;border:2px solid var(--rose);padding:4px 6px;white-space:nowrap;animation:hintFloat 1.7s ease-out forwards;}
@keyframes hintFloat{0%{opacity:0;transform:translateY(8px) scale(.6);}20%{opacity:1;transform:translateY(0) scale(1.05);}75%{opacity:1;transform:translateY(-16px) scale(1);}100%{opacity:0;transform:translateY(-30px) scale(1);}}
.pix-sparkle{position:absolute;width:12px;height:12px;pointer-events:none;z-index:3;background:#ffe27a;
  clip-path:polygon(37% 0,62% 0,62% 37%,100% 37%,100% 62%,62% 62%,62% 100%,37% 100%,37% 62%,0 62%,0 37%,37% 37%);
  animation:heartUp 1.9s ease-out forwards;}
#flowerFrame.opening{animation:cfFadeIn .25s ease-out both;}
#flowerFrame.opening .cake-frame-box{animation:cfBoxIn .5s cubic-bezier(.34,1.56,.64,1) both;}
#flowerFrame.opening #flowerImg{animation:cakeDropIn .6s cubic-bezier(.34,1.56,.64,1) .3s both;}
#flowerFrame.opening #flowerPrompt{animation:promptIn .4s ease-out .2s both;}
#flowerFrame.closing{animation:cfFadeOut .25s ease-in both;}
#flowerFrame.closing .cake-frame-box{animation:cfBoxOut .25s ease-in both;}
@media (prefers-reduced-motion:reduce){#flowerFrame.opening,#flowerFrame.opening *,#flowerFrame.closing,#flowerFrame.closing *,#flowerImg.bloom,#reBloomBtn.pop,.secret-tape.show,.secret-kidding.show{animation:none !important;opacity:1;transform:none;}}

/* camera flash */
#cameraFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999;}

/* blow-candle transition */
.fadeOut{opacity:0 !important;transition:opacity .5s ease;pointer-events:none;}
#blackoutText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 10%;text-align:center;color:#ffe4d6;font-family:'VT323',monospace;font-size:1.9rem;line-height:1.3;letter-spacing:1px;text-shadow:0 0 10px rgba(246,201,214,.55);opacity:1;transition:opacity .6s ease;}
#blackout{position:fixed;inset:0;background:#000;opacity:0;z-index:998;pointer-events:none;transition:opacity .4s ease;}
</style>
</head>
<body>

<div id="particles"></div>
<div id="confettiLayer"></div>
<div id="balloonLayer"></div>
<div id="cameraFlash"></div>

<div id="gatekeeper">

  <div class="stage" id="stageWish">
    <div class="dialogue-box">
      <p class="dialogue-text">Before we bring out the cake, write down your wish for this year... ✨</p>
      <input type="text" id="wishInput" class="wish-input" maxlength="80" placeholder="I wish for...">
      <button class="pxbtn" id="lockWishBtn">🔒 Lock In Wish</button>
    </div>
    <div id="wishParticles"></div>
  </div>

  <div class="stage hidden" id="stageMatch">
    <div class="cakeStage" id="cakeStageMatch">
      <img src="assets/cake_unlit.png" class="pixel cake" id="cakeImgMatch" alt="cake">
      <div class="flame hidden" id="flameMatch"></div>
      <div class="candle-target" id="candleTarget"></div>
    </div>
    <p class="q light-q">Strike the match to light the candle!</p>
    <div class="match-scene" id="matchScene">
      <img src="assets/matchbox.png" class="matchbox" alt="matchbox" draggable="false">
      <img src="assets/match_unlit.png" class="matchstick" id="matchstick" alt="match" draggable="false">
      <div id="sparkWrap"></div>
    </div>
    <p class="strike-hint" id="strikeHint">tap or swipe the match</p>
  </div>

  <div class="stage hidden" id="stageBlow">
    <div class="cakeStage" id="cakeStage">
      <img src="assets/cake_lit.png" class="pixel cake" id="cakeImg" alt="cake">
      <div class="flame" id="flame"></div>
      <div id="smokeWrap"></div>
    </div>
    <p class="q" id="candleQ">Make a wish &amp; blow out the candle! 🎂</p>
    <div class="btnrow" id="blowBtnRow">
      <button class="pxbtn" id="micBtn"> Enable Mic to Blow</button>
      <button class="pxbtn" id="tapBtn"> Tap to Blow Out</button>
    </div>
    <p id="successBanner" class="success-banner hidden">May all your wishes come true, Celyn! 🎉✨</p>
  </div>

</div>

<div id="cakeFrame" class="hidden"><div class="cake-frame-box">
  <button class="closeX" id="cakeFrameClose" aria-label="close">X</button>
  <p id="cakePrompt"></p>
  <div id="cakeEatStage">
    <div class="cake-bubble" id="elsaCakeBubble"></div>
    <div class="cake-bubble" id="annaCakeBubble"></div>
    <button class="cake-buddy elsa" id="elsaCakeBtn" aria-label="Elsa"><img class="pixel" src="assets/elsa.png" alt="Elsa" draggable="false"></button>
    <img class="pixel" id="cakeEatImg" src="assets/cake_stage1.png" alt="cake" draggable="false">
    <button class="cake-buddy anna" id="annaCakeBtn" aria-label="Anna"><img class="pixel" src="assets/anna.png" alt="Anna" draggable="false"></button>
  </div>
  <button class="pxbtn hidden" id="bakeAgainBtn">Bake Another Cake</button>
</div></div>
<div id="flowerFrame" class="hidden"><div class="cake-frame-box">
  <button class="closeX" id="flowerFrameClose" aria-label="close">X</button>
  <p id="flowerPrompt"></p>
  <div id="flowerStage"><img class="pixel" id="flowerImg" src="assets/bouquet_stage1.png" alt="bouquet" draggable="false"></div>
  <p id="flowerBanner"></p>
  <div class="secret-tape hidden" id="secretTape"><small>HIDDEN TRAIT UNLOCKED</small><span id="secretText"></span><em class="secret-kidding" id="secretKidding">...just kidding!</em></div>
  <div><button class="pxbtn hidden" id="reBloomBtn">Re-Bloom Flowers</button></div>
</div></div>
<div id="overlay" class="hidden"><div class="modal" id="modalBox"></div></div>

<div id="dashboard" class="hidden">
  <div class="scenic-card">
    <img src="assets/banner_landscape.png" class="pixel banner" alt="">
    <div class="titlestack" id="titlestack">
      <div class="card-stack">
        <img src="assets/happy_card.png" class="pixel" alt="happy" id="w1">
        <img src="assets/birthday_card.png" class="pixel" alt="birthday" id="w2">
        <img src="assets/celyn_card.png" class="pixel sparkle" alt="Celyn!" id="w3">
      </div>
      <p class="tapHint hidden" id="tapHint">tap</p>
      <img src="assets/cursor_hand.png" class="pixel cursorHint" id="cursorHint" alt="">
    </div>
    <div class="giftWrap" id="giftWrap">
      <p class="giftPrompt" id="giftPrompt">Tap 3 times to open! 🎁</p>
      <div class="giftArea" id="giftArea">
        <button class="giftBtn" id="giftBtn" aria-label="open the gift"><img class="pixel giftImg" id="giftImg" src="assets/gift_box_closed.png" alt="gift box" draggable="false"></button>
      </div>
    </div>
    <div class="grid">
      <button class="appicon gift" data-modal="music"><img class="pixel" src="assets/record.png" alt=""><span>Music</span></button>
      <button class="appicon gift" data-modal="gallery"><img class="pixel" src="assets/camera.png" alt=""><span>Gallery</span></button>
      <button class="appicon gift" data-modal="letter"><img class="pixel" src="assets/envelope.png" alt=""><span>Letter</span></button>
      <button class="appicon gift" data-modal="traits"><img class="pixel" src="assets/question_block.png" alt=""><span>Traits</span></button>
      <button class="appicon gift late hidden" id="messageIcon" data-modal="message"><img class="pixel" src="assets/message_icon.png" alt=""><span>Message (optional)</span></button>
    </div>
  </div>
</div>

<script>
/* ---------- particles ---------- */
for(let i=0;i<16;i++){
  const p=document.createElement('img');
  p.src='assets/petal.png';
  p.className='pixel petal';
  p.alt='';
  p.style.left=Math.random()*100+'vw';
  p.style.width=(16+Math.random()*10)+'px';
  p.style.animationDuration=(6+Math.random()*6)+'s';
  p.style.animationDelay=Math.random()*6+'s';
  document.getElementById('particles').appendChild(p);
}

/* ---------- gatekeeper: blow out the candle ---------- */
const BLACKOUT_TEXT='May all your wishes come true...';
let blownAlready=false;

/* step 1: write your wish */
function spawnWishParticles(){
  const wrap=document.getElementById('wishParticles');
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='wish-particle';
    p.style.left=(20+Math.random()*60)+'%';
    p.style.animationDelay=(Math.random()*.4)+'s';
    p.style.animationDuration=(1+Math.random()*.6)+'s';
    wrap.appendChild(p);
    setTimeout(()=>p.remove(),2200);
  }
}
function lockInWish(){
  const box=document.querySelector('#stageWish .dialogue-box');
  box.classList.add('fadeOut');
  spawnWishParticles();
  setTimeout(()=>{
    document.getElementById('stageWish').classList.add('hidden');
    document.getElementById('stageMatch').classList.remove('hidden');
    document.getElementById('gatekeeper').classList.add('dark-mode');
  }, 1300);
}
document.getElementById('lockWishBtn').addEventListener('click', lockInWish);

/* step 2: strike the match, then drag it to the candle to light it */
let matchStruck=false;
let matchLit=false;
function spawnSparks(){
  const wrap=document.getElementById('sparkWrap');
  for(let i=0;i<12;i++){
    const s=document.createElement('div');
    s.className='spark';
    const ang=Math.random()*Math.PI*2;
    const dist=14+Math.random()*22;
    s.style.setProperty('--dx',(Math.cos(ang)*dist)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*dist-10)+'px');
    s.style.left='113px';
    s.style.top='26px';
    wrap.appendChild(s);
    setTimeout(()=>s.remove(),550);
  }
}
function lightCandle(){
  const stick=document.getElementById('matchstick');
  stick.style.transition='opacity .25s ease';
  stick.style.opacity='0';
  document.getElementById('cakeImgMatch').src='assets/cake_lit.png';
  document.getElementById('flameMatch').classList.remove('hidden');
  setTimeout(()=>{
    stick.remove();
    document.getElementById('stageMatch').classList.add('fadeOut');
    document.getElementById('gatekeeper').classList.remove('dark-mode');
    setTimeout(()=>{
      document.getElementById('stageMatch').classList.add('hidden');
      document.getElementById('stageMatch').classList.remove('fadeOut');
      document.getElementById('stageBlow').classList.remove('hidden');
    }, 500);
  }, 900);
}
function doStrike(){
  if(matchStruck) return;
  matchStruck=true;
  try{ new Audio('assets/audio/match_strike.mp3').play(); }catch(e){}
  document.getElementById('matchstick').classList.add('struck');
  spawnSparks();
  setTimeout(()=>{
    const stick=document.getElementById('matchstick');
    stick.classList.remove('struck');
    stick.src='assets/match_lit.png';
    stick.classList.add('lit');
    matchLit=true;
    const hint=document.getElementById('strikeHint');
    hint.textContent='now drag the match to the candle';
    hint.classList.add('fadeOut');
    requestAnimationFrame(()=>hint.classList.remove('fadeOut'));
  }, 420);
}
document.getElementById('matchScene').addEventListener('click', doStrike);
let matchDragX=null;
document.getElementById('matchstick').addEventListener('pointerdown', e=>{
  if(!matchLit){ matchDragX=e.clientX; return; }
  startMatchDrag(e);
});
document.getElementById('matchstick').addEventListener('pointerup', e=>{
  if(matchDragX!==null && Math.abs(e.clientX-matchDragX)>18) doStrike();
  matchDragX=null;
});

/* dragging the lit match up to the candle */
let dragging=false, dragOffX=0, dragOffY=0;
function startMatchDrag(e){
  const stick=document.getElementById('matchstick');
  dragging=true;
  stick.setPointerCapture(e.pointerId);
  stick.classList.add('dragging');
  const rect=stick.getBoundingClientRect();
  dragOffX=e.clientX-rect.left;
  dragOffY=e.clientY-rect.top;
  stick.style.transform='none';
  stick.style.position='fixed';
  stick.style.left=rect.left+'px';
  stick.style.top=rect.top+'px';
  stick.style.bottom='auto';
  stick.addEventListener('pointermove', moveMatchDrag);
  stick.addEventListener('pointerup', endMatchDrag, {once:true});
  stick.addEventListener('pointercancel', endMatchDrag, {once:true});
  checkHold();
}
let holdTimer=null;
function checkHold(){
  if(!dragging){ clearTimeout(holdTimer); holdTimer=null; return; }
  if(nearCandle()){
    if(!holdTimer) holdTimer=setTimeout(()=>{
      holdTimer=null;
      if(dragging && nearCandle()){ dragging=false; finishLight(); }
    }, 1000);
  }else if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
}
function finishLight(){
  const stick=document.getElementById('matchstick');
  stick.classList.remove('dragging');
  stick.removeEventListener('pointermove', moveMatchDrag);
  lightCandle();
}
function moveMatchDrag(e){
  if(!dragging) return;
  const stick=document.getElementById('matchstick');
  stick.style.left=(e.clientX-dragOffX)+'px';
  stick.style.top=(e.clientY-dragOffY)+'px';
  checkHold();
}
function nearCandle(){
  const stick=document.getElementById('matchstick');
  const target=document.getElementById('candleTarget');
  const sr=stick.getBoundingClientRect();
  const tr=target.getBoundingClientRect();
  return !(sr.right<tr.left||sr.left>tr.right||sr.bottom<tr.top||sr.top>tr.bottom);
}
function endMatchDrag(e){
  const wasDragging=dragging;
  dragging=false;
  clearTimeout(holdTimer); holdTimer=null;
  if(!wasDragging) return;
  const stick=document.getElementById('matchstick');
  stick.classList.remove('dragging');
  stick.removeEventListener('pointermove', moveMatchDrag);
  if(nearCandle()){
    lightCandle();
  }else{
    stick.style.transition='left .3s ease, top .3s ease';
    stick.style.position='';
    stick.style.left='';
    stick.style.top='';
    stick.style.bottom='';
    stick.style.transform='';
    setTimeout(()=>{ stick.style.transition=''; }, 320);
  }
}

/* mic-based blow detection via Web Audio API */
const BLOW_THRESHOLD=42; // 0-255 average frequency level; tune if too sensitive/insensitive
const WIND_THRESHOLD=18; // lower level that just makes the flame flicker in the "wind"
async function enableMicBlow(){
  const micBtn=document.getElementById('micBtn');
  const flame=document.getElementById('flame');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    const ctx=new AudioCtx();
    const source=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();
    analyser.fftSize=512;
    source.connect(analyser);
    const data=new Uint8Array(analyser.frequencyBinCount);
    micBtn.textContent='🎤 Listening… blow now!';
    micBtn.disabled=true;
    function stopMic(){
      stream.getTracks().forEach(t=>t.stop());
      ctx.close();
    }
    function checkLevel(){
      if(blownAlready||blowStarted){ stopMic(); return; }
      analyser.getByteFrequencyData(data);
      let sum=0;
      for(let i=0;i<data.length;i++) sum+=data[i];
      const avg=sum/data.length;
      if(avg>BLOW_THRESHOLD){
        stopMic();
        triggerBlowOut('mic');
      }else{
        flame.classList.toggle('blowing', avg>WIND_THRESHOLD);
        requestAnimationFrame(checkLevel);
      }
    }
    checkLevel();
  }catch(e){
    /* mic blocked or unsupported: fall back to tap */
    micBtn.classList.add('hidden');
  }
}
document.getElementById('micBtn').addEventListener('click',enableMicBlow);

}

  el.style.background=Math.random()<.5?'#ff6f9c':'#f6a3bd';

  setTimeout(()=>el.remove(),1900);
}
function eatCake(){

  cakeStage++;

  cakeFrame.classList.remove('opening'); cakeEatImg.classList.remove('bake');
  cakeEatImg.classList.remove('munch'); void cakeEatImg.offsetWidth; cakeEatImg.classList.add('munch');
  spawnCrumbs();
  clearCakeTalk();
  if(cakeBiteLines[cakeStage]) sayCake(cakeBiteLines[cakeStage][0],cakeBiteLines[cakeStage][1],2600);

    cakeTalkLater(150,'elsa',"All gone! That was the sweetest bite!",2600);

/* ---------- flower picking mini-game ---------- */
const FLOWER_STAGES=[1,2,3,4,5,6].map(n=>'assets/bouquet_stage'+n+'.png');
const FLOWER_PROMPT='Tap to pick a petal for Celyn!';
const FLOWER_DONE="Yum! Celyn's wishes bloomed!";
const SECRET_TRAIT='SECRETLY A YEARNER';
const PETAL_COLORS=['#ff9fbd','#f6c9d6','#ffd1dc','#8fae87','#f3c26b','#fff4e0'];
const FLOWER_HINTS={2:['so kind','so caring'],3:['so creative'],5:['so adorable']};
let flowerStage=0, flowerHeartTimer=null, flowerOpenTimer=null, flowerCloseTimer=null;
const flowerFrame=document.getElementById('flowerFrame');
const flowerImg=document.getElementById('flowerImg');
const flowerStageEl=document.getElementById('flowerStage');
const flowerPrompt=document.getElementById('flowerPrompt');
const flowerBanner=document.getElementById('flowerBanner');
const secretTape=document.getElementById('secretTape');
const reBloomBtn=document.getElementById('reBloomBtn');
document.getElementById('secretText').textContent=SECRET_TRAIT;
FLOWER_STAGES.forEach(src=>{const i=new Image();i.src=src;});
function clearFlowerFx(){
  flowerStageEl.querySelectorAll('.crumb,.pix-heart,.pix-sparkle,.petal-hint').forEach(n=>n.remove());
}
function openFlowerFrame(){
  clearTimeout(flowerCloseTimer); clearTimeout(flowerOpenTimer);
  resetFlower(false);
  flowerFrame.classList.remove('closing','opening');
  void flowerFrame.offsetWidth;
  flowerFrame.classList.remove('hidden');
  flowerFrame.classList.add('opening');
  flowerOpenTimer=setTimeout(()=>flowerFrame.classList.remove('opening'),1100);
}
function closeFlowerFrame(){
  clearInterval(flowerHeartTimer); flowerHeartTimer=null;
  clearTimeout(flowerOpenTimer);
  if(flowerFrame.classList.contains('hidden')) return;
  flowerFrame.classList.remove('opening');
  flowerFrame.classList.add('closing');
  clearTimeout(flowerCloseTimer);
  flowerCloseTimer=setTimeout(()=>{
    flowerFrame.classList.add('hidden');
    flowerFrame.classList.remove('closing');
    clearFlowerFx();
  },260);
}
function resetFlower(animate){
  clearInterval(flowerHeartTimer); flowerHeartTimer=null;
  clearFlowerFx();
  flowerStage=0;
  flowerImg.src=FLOWER_STAGES[0];
  flowerImg.classList.remove('done','munch','bloom');
  void flowerImg.offsetWidth;
  if(animate) flowerImg.classList.add('bloom');
  flowerPrompt.textContent=FLOWER_PROMPT;
  flowerBanner.textContent='';
  flowerBanner.classList.remove('show');
  secretTape.classList.add('hidden'); secretTape.classList.remove('show');
  document.getElementById('secretKidding').classList.remove('show');
  reBloomBtn.classList.add('hidden'); reBloomBtn.classList.remove('pop');
}
function spawnPetals(n){
  const w=flowerImg.offsetWidth, h=flowerImg.offsetHeight;
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='crumb';
    c.style.background=PETAL_COLORS[Math.floor(Math.random()*PETAL_COLORS.length)];
    c.style.left=(flowerImg.offsetLeft+w*(0.3+Math.random()*0.4))+'px';
    c.style.top=(flowerImg.offsetTop+h*(0.15+Math.random()*0.3))+'px';
    c.style.setProperty('--cx',((Math.random()-.5)*140)+'px');
    c.style.setProperty('--cy',(-(14+Math.random()*46))+'px');
    flowerStageEl.appendChild(c);
    setTimeout(()=>c.remove(),950);
  }
}
function spawnPetalHint(text,idx){
  const w=flowerImg.offsetWidth, h=flowerImg.offsetHeight;
  const el=document.createElement('div');
  el.className='petal-hint';
  el.textContent=text;
  const left=(idx%2===0);
  el.style.top=(flowerImg.offsetTop+h*(0.08+Math.random()*0.3))+'px';
  if(left) el.style.left=Math.max(0,flowerImg.offsetLeft-4)+'px';
  else el.style.right=Math.max(0,flowerStageEl.offsetWidth-(flowerImg.offsetLeft+w)-4)+'px';
  flowerStageEl.appendChild(el);
  setTimeout(()=>el.remove(),1800);
}
function spawnFlowerHeart(){
  const w=flowerImg.offsetWidth, h=flowerImg.offsetHeight;
  const sparkle=Math.random()<.45;
  const el=document.createElement('div');
  el.className=sparkle?'pix-sparkle':'pix-heart';
  el.style.left=(flowerImg.offsetLeft+w*(0.3+Math.random()*0.4))+'px';
  el.style.top=(flowerImg.offsetTop+h*(0.25+Math.random()*0.2))+'px';
  el.style.setProperty('--hx',((Math.random()-.5)*70)+'px');
  if(!sparkle) el.style.background=Math.random()<.5?'#ff6f9c':'#f6a3bd';
  flowerStageEl.appendChild(el);
  setTimeout(()=>el.remove(),2000);
}
function pickPetal(){
  if(flowerStage>=FLOWER_STAGES.length-1) return;
  flowerStage++;
  flowerFrame.classList.remove('opening'); flowerImg.classList.remove('bloom');
  flowerImg.src=FLOWER_STAGES[flowerStage];
  flowerImg.classList.remove('munch'); void flowerImg.offsetWidth; flowerImg.classList.add('munch');
  spawnPetals(flowerStage===1?4+Math.floor(Math.random()*3):6+Math.floor(Math.random()*4));
  (FLOWER_HINTS[flowerStage]||[]).forEach((t,i)=>setTimeout(()=>spawnPetalHint(t,i+flowerStage),i*260));
  if(flowerStage===FLOWER_STAGES.length-1){
    flowerImg.classList.add('done');
    flowerPrompt.textContent='';
    flowerBanner.textContent=FLOWER_DONE;
    flowerBanner.classList.remove('show'); void flowerBanner.offsetWidth; flowerBanner.classList.add('show');
    for(let i=0;i<4;i++) setTimeout(spawnFlowerHeart,i*130);
    clearInterval(flowerHeartTimer);
    flowerHeartTimer=setInterval(spawnFlowerHeart,380);
    setTimeout(()=>{
      if(flowerStage!==FLOWER_STAGES.length-1) return;
      secretTape.classList.remove('hidden'); void secretTape.offsetWidth; secretTape.classList.add('show');
    },700);
    setTimeout(()=>{
      if(flowerStage!==FLOWER_STAGES.length-1) return;
      document.getElementById('secretKidding').classList.add('show');
    },2400);
    setTimeout(()=>{
      if(flowerStage!==FLOWER_STAGES.length-1) return;
      reBloomBtn.classList.remove('hidden'); void reBloomBtn.offsetWidth; reBloomBtn.classList.add('pop');
    },3100);
  }
}
flowerImg.addEventListener('click',pickPetal);
reBloomBtn.addEventListener('click',()=>resetFlower(true));
document.getElementById('flowerFrameClose').addEventListener('click',closeFlowerFrame);
flowerFrame.addEventListener('click',e=>{ if(e.target===flowerFrame) closeFlowerFrame(); });

const duoBag={elsa:[],anna:[]};
function nextLine(who){
  if(!duoBag[who].length) duoBag[who]=[...duoLines[who]].sort(()=>Math.random()-.5);
  return duoBag[who].pop();
}
function say(who,text,ms){
  ['elsa','anna'].forEach(w=>{ const b=document.getElementById(w+'Bubble'); if(b && w!==who) b.classList.remove('show'); });
  const b=document.getElementById(who+'Bubble');
  if(!b) return;
  b.textContent=text;
  b.classList.add('show');
  clearTimeout(b._t);
  b._t=setTimeout(()=>b.classList.remove('show'),ms||3200);
  const item=document.getElementById(who+'Btn');
  item.classList.remove('hop'); void item.offsetWidth; item.classList.add('hop');
}
function initGallery(){
  ['elsa','anna'].forEach(w=>{
    document.getElementById(w+'Btn').addEventListener('click',()=>{
      galleryTimers.forEach(clearTimeout); galleryTimers=[]; /* stop the greeting if she taps */
      say(w,nextLine(w));
    });
  });
  /* they greet her when the gallery opens, one after the other */

}

/* ---------- music player ---------- */
const tracks=[
  {title:"happy",artist:"Skinnyfabs",src:"assets/audio/1_happy.mp3"},
  {title:"Birthday",artist:"Katy Perry",src:"assets/audio/2_birthday.mp3"},
  {title:"To you",artist:"SEVENTEEN",src:"assets/audio/3_to_you.mp3"},
  {title:"Ripples",artist:"beabadoobee",src:"assets/audio/4_ripples.mp3"},
  {title:"About You",artist:"The 1975",src:"assets/audio/5_about_you.mp3"}
];
const trackPositions=[28.7,42.55,56.5,70.2,84.4];
const player=new Audio();
let currentIdx=null;
function setDisc(on){
  document.querySelectorAll('.appicon[data-modal="music"] img').forEach(i=>i.classList.toggle('spin',on));
}
function refreshIcons(){
  setDisc(currentIdx!==null); /* disc spins only while a playlist track is playing */
  tracks.forEach((t,i)=>{
    const btn=document.getElementById('tbtn'+i), icon=document.getElementById('ticon'+i);
    const on=(currentIdx===i);
    if(icon) icon.src=on?'assets/btn_pause.png':'assets/btn_play.png';
    if(btn){btn.classList.toggle('playing',on);btn.setAttribute('aria-label',on?'pause':'play');}
  });
}
function playTrack(i){
  pauseBg();
  player.src=tracks[i].src;
  player.play().catch(()=>{});
  currentIdx=i;
  refreshIcons();
  setDisc(true);
}
function stopTrack(){
  player.pause();
  currentIdx=null;
  refreshIcons();
  resumeBg(); /* fall back to the happy birthday sound */
}
player.addEventListener('ended',()=>{ currentIdx=null; refreshIcons(); resumeBg(); });
function initMusic(){
  tracks.forEach((t,i)=>{
    document.getElementById('tbtn'+i).addEventListener('click',()=>toggleTrack(i));
  });
  refreshIcons(); /* show what's already playing */
}
function toggleTrack(i){
  if(currentIdx===i && !player.paused) stopTrack();
  else playTrack(i);
}

const MESSAGE_WEBHOOK='https://discord.com/api/webhooks/1382000326013489223/LthuGBG_prhgk0wz0agIxO07-wTqK6eOQ08BkNMKIPEhEgp5jdynLjMVrfSCZf9fqSWp';
function initMessage(){
  const btn=document.getElementById('sendMsgBtn');
  const status=document.getElementById('msgStatus');
  const textEl=document.getElementById('msgText');
  btn.addEventListener('click',async()=>{
    const text=textEl.value.trim();
    if(!text){ status.textContent='Type something first~'; return; }
    btn.disabled=true;
    status.textContent='Sending...';
    try{
      const res=await fetch(MESSAGE_WEBHOOK,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({content:`💌 **Message from Celyn:**\n${text}`})
      });
      if(res.ok){
        status.textContent='Sent! 🌸 thank you.';
        textEl.value='';
      }else{
        status.textContent="Hmm, that didn't send. Try again?";
      }
    }catch(e){
      status.textContent="Hmm, that didn't send. Try again?";
    }
    btn.disabled=false;
  });
}
